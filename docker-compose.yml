version: '3.8'

services:
  wagent-crm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wagent_crm
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - AI_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AI_MODEL=gemini-2.0-flash
      - TTS_PROVIDER=edge
      - AI_VOICE_MODEL=es-MX-DaliaNeural
    volumes:
      # Persistencia de base de datos, credenciales de WhatsApp QR y multimedia
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/leads"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
